<body>
<a href="#main" class="skip-link">Skip to content</a>

<main id="main">
<header class="donate-hero donate-hero--draw">
  <div class="wrap wrap--narrow">
    <p class="eyebrow" data-animate="fade-up" data-i18n="tickets.hero.eyebrow">Find my donation</p>
    <h1 data-animate="fade-up" data-animate-delay="0.07" data-i18n="tickets.hero.title">Lost the text? Look up your donation here</h1>
    <p data-animate="fade-up" data-animate-delay="0.14" data-i18n="tickets.hero.sub">Enter the phone number you gave us to see your donation status.</p>
  </div>
</header>

<section class="tile tile--a">
  <div class="wrap wrap--narrow stack" style="--flow:1.6rem">

    <div class="donate-panel" data-animate="fade-up">
      <h2 data-i18n="tickets.panel.title">Look up your donation</h2>
      <p class="lead" style="color:var(--c-ink-soft);opacity:1" data-i18n="tickets.panel.lead">Just the phone number you gave us when you donated.</p>

      <label class="field field--text" for="lkPhone"><input id="lkPhone" data-lookup-phone type="tel" inputmode="tel" autocomplete="tel" placeholder="Phone number" data-i18n-placeholder="tickets.field.phone"></label>

      <a class="btn btn--gold btn--block btn--lg" data-lookup-go href="#" data-i18n="tickets.go">Find my donation</a>
      <p class="donate-status" data-lookup-status hidden></p>

      <div class="lookup-results" data-lookup-results hidden></div>
    </div>

  </div>
</section>

<section class="wrap wrap--narrow" data-desk hidden></section>
</main>
