<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-title="tickets.title">Find My Ticket · Vimusement {year}</title>
<meta name="description" data-i18n-content="tickets.meta.description" content="Look up your Vimusement Lucky Draw tickets and donations by phone number, anytime.">
<link rel="icon" type="image/png" href="assets/img/shared/favicon.png">
<script>document.documentElement.className+=" js";(function(){try{var m=localStorage.getItem("vim-theme");if(m==="light"||m==="dark")document.documentElement.setAttribute("data-theme",m);}catch(e){}})();
(function(){try{if(localStorage.getItem("vim-lang")==="ta")document.documentElement.setAttribute("data-lang","ta");}catch(e){}})();
(function(){try{var d=sessionStorage.getItem("vim-nav-dir");if(d){document.documentElement.setAttribute("data-nav-dir",d);sessionStorage.removeItem("vim-nav-dir");}}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/animations.css">
<link rel="stylesheet" href="assets/css/pages/donate.css">
<link rel="stylesheet" href="assets/css/pages/ticket.css">
<link rel="stylesheet" href="assets/css/pages/tickets.css">
<link rel="stylesheet" href="assets/css/desk.css">
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>

<main id="main">
<header class="donate-hero donate-hero--draw">
  <div class="wrap wrap--narrow">
    <p class="eyebrow" data-animate="fade-up" data-i18n="tickets.hero.eyebrow">Find my ticket</p>
    <h1 data-animate="fade-up" data-animate-delay="0.07" data-i18n="tickets.hero.title">Lost the text? Look up your ticket here</h1>
    <p data-animate="fade-up" data-animate-delay="0.14" data-i18n="tickets.hero.sub">Enter the phone number you gave us to see your Lucky Draw numbers and donation status.</p>
  </div>
</header>

<section class="tile tile--a">
  <div class="wrap wrap--narrow stack" style="--flow:1.6rem">

    <div class="donate-panel" data-animate="fade-up">
      <h2 data-i18n="tickets.panel.title">Look up your ticket</h2>
      <p class="lead" style="color:var(--c-ink-soft);opacity:1" data-i18n="tickets.panel.lead">Just the phone number you gave us at purchase.</p>

      <label class="field field--text" for="lkPhone"><input id="lkPhone" data-lookup-phone type="tel" inputmode="tel" autocomplete="tel" placeholder="Phone number" data-i18n-placeholder="tickets.field.phone"></label>

      <a class="btn btn--gold btn--block btn--lg" data-lookup-go href="#" data-i18n="tickets.go">Find my ticket</a>
      <p class="donate-status" data-lookup-status hidden></p>

      <div class="lookup-results" data-lookup-results hidden></div>
    </div>

  </div>
</section>

<section class="wrap wrap--narrow" data-desk hidden></section>
</main>

<footer class="footer" data-site-footer></footer>
<nav class="dock" data-dock aria-label="Primary"></nav>

<script defer src="assets/js/core.js"></script>
<script defer src="assets/js/strings.js"></script>
<script defer src="years/2026.config.js"></script>
<script defer src="years/current.js"></script>
<script defer src="assets/js/site.config.js"></script>
<script defer src="assets/js/modules/chrome.js"></script>
<script defer src="assets/js/modules/i18n.js"></script>
<script defer src="assets/js/modules/theme.js"></script>
<script defer src="assets/js/modules/lang.js"></script>
<script defer src="assets/js/modules/langprompt.js"></script>
<script defer src="assets/js/modules/dock.js"></script>
<script defer src="assets/js/modules/dockswipe.js"></script>
<script defer src="assets/js/modules/render.js"></script>
<script defer src="assets/js/modules/motion.js"></script>
<script defer src="assets/js/modules/tickets.js"></script>
<script defer src="assets/js/modules/desk.js"></script>
<script defer src="assets/js/modules/polish.js"></script>
<script defer src="assets/js/main.js"></script>
</body>
</html>
